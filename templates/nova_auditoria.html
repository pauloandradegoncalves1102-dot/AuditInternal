{% extends "base.html" %}
{% block content %}
<h2>Nova Auditoria</h2>
<div class="card">
    <form method="POST">
        <div class="form-group">
            <label>Título</label>
            <input type="text" name="titulo" placeholder="Ex: Auditoria do Processo de Compras" required>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Escopo / Área</label>
                <input type="text" name="escopo" placeholder="Ex: Departamento de Suprimentos" required>
            </div>
            <div class="form-group">
                <label>Auditor Responsável</label>
                <input type="text" name="auditor" placeholder="Nome do auditor" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Data de Início</label>
                <input type="date" name="data_inicio" required>
            </div>
            <div class="form-group">
                <label>Data de Término</label>
                <input type="date" name="data_fim" required>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Criar Auditoria</button>
    </form>
</div>
{% endblock %}
